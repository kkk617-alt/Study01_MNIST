<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>손글씨 숫자 인식기</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>손글씨 숫자 인식기</h1>
    <p class="설명">
      MNIST 로 학습한 CNN 을 외부 라이브러리 없이 자바스크립트로만 실행합니다.
      추론은 전부 브라우저 안에서 일어나며, 그린 그림은 어디로도 전송되지 않습니다.
    </p>

    <div class="작업판">
      <section class="그리는쪽">
        <h2>여기에 숫자를 그리세요</h2>
        <canvas id="캔버스" width="280" height="280"></canvas>
        <div class="단추들">
          <button id="지우기단추" type="button">지우기 (Esc)</button>
          <button id="인식단추" type="button">다시 인식 (Enter)</button>
        </div>
      </section>

      <section class="결과쪽">
        <h2>인식 결과</h2>
        <div id="결과숫자" class="결과숫자">?</div>
        <p id="확신도" class="확신도">모델을 불러오는 중...</p>
        <h3>상위 3개 후보</h3>
        <pre id="후보들" class="후보들"></pre>
      </section>
    </div>

    <p class="꼬리말">
      데스크톱 버전(PyTorch + tkinter)은 저장소의 <code>desktop_version/</code> 에 있습니다.
    </p>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
