<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>손글씨 숫자 인식기</title>

  <!-- 저장소 루트에는 볼 것이 없으므로 웹 데모로 보낸다.
       자바스크립트가 꺼져 있을 때를 위한 대비책이다. -->
  <meta http-equiv="refresh" content="0; url=./web_version/">
  <link rel="canonical" href="./web_version/">

  <style>
    body {
      margin: 0;
      padding: 48px 16px;
      background: #f4f5f7;
      color: #1f2430;
      font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
      line-height: 1.6;
      text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #5a6272; font-size: 14px; }
    a { color: #1565c0; }
  </style>
</head>
<body>
  <h1>손글씨 숫자 인식기</h1>
  <p>웹 데모로 이동하는 중입니다.</p>
  <p><a href="./web_version/">자동으로 넘어가지 않으면 여기를 누르세요</a></p>

  <script>
    // 뒤로가기를 눌렀을 때 이 페이지로 되돌아와 다시 튕기는 것을 막으려고
    // history 에 기록을 남기지 않는 replace 를 쓴다.
    // 경로는 상대경로여야 한다. GitHub Pages 에서는 저장소 이름이 앞에 붙는다.
    location.replace("./web_version/");
  </script>
</body>
</html>
